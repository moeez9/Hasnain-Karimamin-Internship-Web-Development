<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Dynamic Content Skeleton Loader -->
    <div id="loader" class="page-loader">
        <div class="spinner"></div>
    </div>

    <!-- Main Content Area -->
    <main id="about-content" style="display: none;">
        <!-- Hero Section -->
        <header class="hero" id="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 id="display-company-name">Company Name</h1>
                <p class="subtitle">Discover our story, mission, and vision.</p>
            </div>
        </header>

        <!-- Details Section -->
        <section class="details-section container">
            
            <div class="description-card">
                <h2>Who We Are</h2>
                <div id="display-description" class="rich-text-content">
                    <!-- Dynamic Description -->
                </div>
            </div>

            <div class="cards-grid">
                <div class="info-card">
                    <div class="card-icon" aria-hidden="true">
                        <i class="fa-solid fa-bullseye"></i>
                    </div>
                    <h3>Our Mission</h3>
                    <p id="display-mission">Loading...</p>
                </div>
                <div class="info-card">
                    <div class="card-icon" aria-hidden="true">
                        <i class="fa-solid fa-eye"></i>
                    </div>
                    <h3>Our Vision</h3>
                    <p id="display-vision">Loading...</p>
                </div>
            </div>

        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
