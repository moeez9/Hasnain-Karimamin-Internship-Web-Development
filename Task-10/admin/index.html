<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin Panel</title>
    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- Login Container -->
    <div id="login-container" class="container">
        <div class="card">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div id="login-error" class="error-msg"></div>
                <button type="submit" id="login-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard Container -->
    <div id="dashboard-container" class="container" style="display: none;">
        <div class="dashboard-header">
            <h2>About Page CMS</h2>
            <button id="logout-btn" class="btn-secondary">Logout</button>
        </div>

        <div class="card">
            <div id="alert-box" class="alert" style="display: none;"></div>
            
            <form id="about-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="company_name">Company Name</label>
                    <input type="text" id="company_name" name="company_name" required>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <div id="editor-container"></div>
                    <input type="hidden" id="description" name="description">
                </div>

                <div class="form-group">
                    <label for="mission">Mission Statement</label>
                    <textarea id="mission" name="mission" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="vision">Vision Statement</label>
                    <textarea id="vision" name="vision" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="image_url">Image URL (Optional)</label>
                    <input type="text" id="image_url" name="image_url" placeholder="https://example.com/about.jpg">
                </div>

                <div class="form-group">
                    <label for="image">Cover Image Upload (Optional)</label>
                    <input type="file" id="image" name="image" accept="image/*">
                    <div id="current-image-preview" style="margin-top: 10px;"></div>
                </div>

                <button type="submit" id="update-btn">
                    <span class="btn-text">Update Information</span>
                    <span class="loader" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- Quill.js JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
